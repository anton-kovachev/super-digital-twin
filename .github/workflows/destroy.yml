name: Destroy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      confirm:
        description: "Type the environment name to confirm destruction"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "${{ github.event.inputs.environment }}" ]; then
            echo "❌ Confirmation does not match environment name!"
            echo "You entered: '${{ github.event.inputs.confirm }}'"
            echo "Expected: '${{ github.event.inputs.environment }}'"
            exit 1
          fi
          echo "✅ Destruction confirmed for ${{ github.event.inputs.environment }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-destroy
          aws-region: ${{ secrets.DEFAULT_AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # Important: disable wrapper to get raw outputs

      - name: Run Destroy Script
        run: |
          # Set environment variables for the script
          export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          export DEFAULT_AWS_REGION=${{ secrets.DEFAULT_AWS_REGION }}

          # Make script executable and run it
          chmod +x scripts/destroy.sh
          ./scripts/destroy.sh ${{ github.event.inputs.environment }} ${{ secrets.PROJECT_NAME }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          DEFAULT_AWS_REGION: ${{ secrets.DEFAULT_AWS_REGION }}
          TF_VAR_default_aws_region: ${{ secrets.DEFAULT_AWS_REGION }}
          TF_VAR_aws_bedrock_base_url: ${{ secrets.AWS_BEDROCK_BASE_URL }}
          TF_VAR_aws_region: ${{ secrets.DEFAULT_AWS_REGION }}
          TF_VAR_project_id: ${{ secrets.PROJECT_ID }}
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}
          TF_VAR_bedrock_model_id: ${{ secrets.BEDROCK_MODEL_ID }}
          TF_VAR_lambda_timeout: ${{ secrets.LAMBDA_TIMEOUT }}
          TF_VAR_api_throttle_burst_limit: ${{ secrets.API_THROTTLE_BURST_LIMIT }}
          TF_VAR_api_throttle_rate_limit: ${{ secrets.API_THROTTLE_RATE_LIMIT }}
          TF_VAR_use_custom_domain: ${{ secrets.USE_CUSTOM_DOMAIN }}
          TF_VAR_root_domain: ${{ secrets.ROOT_DOMAIN }}
          TF_VAR_push_over_user: ${{ secrets.PUSH_OVER_USER }}
          TF_VAR_push_over_token: ${{ secrets.PUSH_OVER_TOKEN }}
          TF_VAR_email_smtp_server: ${{ secrets.EMAIL_SMTP_SERVER }}
          TF_VAR_email_app_password: ${{ secrets.EMAIL_APP_PASSWORD }}
          TF_VAR_email_address: ${{ secrets.EMAIL_ADDRESS }}
          TF_VAR_github_mcp_token: ${{ secrets.MCP_GITHUB_TOKEN }}
          TF_VAR_llm_model_id: ${{ secrets.LLM_MODEL_ID }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_use_s3: ${{ secrets.USE_S3 }}

      - name: Destruction Complete
        run: |
          echo "✅ Environment ${{ github.event.inputs.environment }} has been destroyed!"
